{% extends "base.html" %}
{% block title %}Login — Student Dashboard{% endblock %}

{% block content %}
<div class="container" style="max-width: 420px;">
  <div style="margin-top: 2rem;">
    <h2 style="font-size: 22px; font-weight: 700; margin-bottom: 0.4rem;">Sign in</h2>
    <p style="color: var(--muted); font-size: 14px; margin-bottom: 2rem;">Use <strong style="color:var(--text)">admin</strong> / <strong style="color:var(--text)">1234</strong> to log in.</p>

    <div class="card">
      <form method="POST">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" name="username" id="username" placeholder="admin" autocomplete="username" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" name="password" id="password" placeholder="••••••••" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center; margin-top:0.5rem;">Sign in</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
