{% extends "base.html" %}
{% block title %}Add Student — Student Dashboard{% endblock %}

{% block content %}
<div class="container" style="max-width: 480px;">
  <div style="margin-top: 2rem;">
    <h2 style="font-size: 22px; font-weight: 700; margin-bottom: 0.4rem;">Add a student</h2>
    <p style="color: var(--muted); font-size: 14px; margin-bottom: 2rem;">Enter the student's name and marks out of 100.</p>

    <div class="card">
      <form method="POST">
        <div class="form-group">
          <label for="name">Full name</label>
          <input type="text" name="name" id="name" placeholder="e.g. Priya Sharma" required>
        </div>
        <div class="form-group">
          <label for="marks">Marks (0 – 100)</label>
          <input type="number" name="marks" id="marks" min="0" max="100" placeholder="e.g. 78" required>
        </div>

        <div style="background:var(--surface2); border-radius:var(--radius); padding:12px 14px; font-size:13px; color:var(--muted); margin-bottom:1.25rem;">
          ≥ 80 → <span style="color:#4ade80">Excellent</span> &nbsp;·&nbsp;
          60–79 → <span style="color:#60a5fa">Good</span> &nbsp;·&nbsp;
          &lt; 60 → <span style="color:#fb923c">Needs Improvement</span>
        </div>

        <div style="display:flex; gap:10px;">
          <button type="submit" class="btn btn-primary">Add student</button>
          <a href="/students" class="btn">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
